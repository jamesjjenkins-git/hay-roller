# Publishes the game to GitHub Pages on every push to the main branch.
# One-off setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". (Free accounts need the repo to be public.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/farm-casino-hay-races-jjno0j]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest css js icons _site/
      - name: Stamp build version (cache-busting + update checks)
        run: |
          V="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          # Every script and stylesheet URL gets ?v=<build>, so a new build can
          # never mix with files a phone cached from an older one.
          sed -i -E "s#(src|href)=\"(js/[^\"]+|css/[^\"]+)\"#\1=\"\2?v=$V\"#g" _site/index.html
          sed -i "s#__BUILD__#$V#" _site/index.html
          printf '{"version":"%s"}\n' "$V" > _site/version.json
          grep -c "?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
